mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: fixture-secret
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - 1.1.1.1
    - 9.9.9.9
  custom-unknown-field: preserve-me
  respect-rules: true
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
sniffer:
  enable: true
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT
rules:
  - DOMAIN-SUFFIX,example.com,PROXY
  - MATCH,DIRECT
