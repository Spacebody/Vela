name: Secret Pattern Scan

on:
  pull_request:
  push:
    branches: [main, release/1.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4, pinned to a full upstream commit SHA.
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks/gitleaks-action v2, pinned to a full upstream commit SHA.
      - name: Scan Git history and worktree for secret patterns
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
