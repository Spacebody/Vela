name: Protected Core Ingest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact signed and reviewed Vela release tag
        required: true
        type: string
      seed_path:
        description: Exact reviewed upstream seed path in the tagged checkout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vela-core-production-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - vela-release
    environment: core-production
    timeout-minutes: 120
    steps:
      # The `runner` expression context is unavailable while GitHub parses
      # job-level `env`. Resolve the runner-owned temporary root at step runtime.
      - name: Initialize isolated Core ingest paths
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" | /usr/bin/grep -Eq '^[0-9]+$'
          printf '%s\n' "${GITHUB_RUN_ATTEMPT}" | /usr/bin/grep -Eq '^[0-9]+$'
          test -n "${RUNNER_TEMP}"
          RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'VELA_CORE_CREDENTIAL_ROOT=%s/vela-core-credentials-%s\n' "${RUNNER_TEMP}" "${RUN_SUFFIX}"
            printf 'VELA_CORE_PREPARED=%s/vela-core-prepared-%s\n' "${RUNNER_TEMP}" "${RUN_SUFFIX}"
            printf 'VELA_CORE_PUBLIC=%s/vela-core-public-%s\n' "${RUNNER_TEMP}" "${RUN_SUFFIX}"
            printf 'VELA_CORE_PRIOR_CATALOG=%s/vela-core-prior-catalog-%s.json\n' "${RUNNER_TEMP}" "${RUN_SUFFIX}"
            printf 'VELA_CORE_EVIDENCE_ROOT=%s/vela-core-private-evidence-%s\n' "${RUNNER_TEMP}" "${RUN_SUFFIX}"
          } >>"${GITHUB_ENV}"

      # actions/checkout v4.2.2, pinned to the complete commit SHA.
      - name: Check out trusted tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert protected Apple Silicon release host
        env:
          REVIEWED_SEED_PATH: ${{ inputs.seed_path }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_SIGNING_FINGERPRINT: ${{ vars.RELEASE_TAG_SIGNING_FINGERPRINT }}
        run: |
          test "$(uname -m)" = "arm64"
          test -z "$(git status --porcelain)"
          case "${RELEASE_TAG}" in
            ""|*/*) echo "release tag must be an unqualified tag name" >&2; exit 1 ;;
          esac
          TAG_REF="refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "${TAG_REF}"
          test "$(git cat-file -t "${TAG_REF}")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG_REF}^{commit}")"
          EXPECTED_FINGERPRINT="$(printf '%s' "${RELEASE_TAG_SIGNING_FINGERPRINT}" | /usr/bin/tr '[:lower:]' '[:upper:]')"
          printf '%s\n' "${EXPECTED_FINGERPRINT}" | /usr/bin/grep -Eq '^[0-9A-F]{40}([0-9A-F]{24})?$'
          TAG_STATUS="$(/usr/bin/mktemp "${RUNNER_TEMP}/vela-core-tag-status.XXXXXX")"
          if ! git verify-tag --raw "${TAG_REF}" >/dev/null 2>"${TAG_STATUS}"; then
            /bin/rm -f "${TAG_STATUS}"
            echo "release tag signature verification failed" >&2
            exit 1
          fi
          /usr/bin/awk -v expected="${EXPECTED_FINGERPRINT}" '
            $2 == "VALIDSIG" {
              for (index = 3; index <= NF; index += 1) {
                if (toupper($index) == expected) found = 1
              }
            }
            END { exit(found ? 0 : 1) }
          ' "${TAG_STATUS}"
          /bin/rm -f "${TAG_STATUS}"
          test -f "${REVIEWED_SEED_PATH}"
          test ! -L "${REVIEWED_SEED_PATH}"
          ./Release/Core/CompatibilityLab/test_compatibility_lab.sh
          ./Release/Core/validate_upstream_seed.py "${REVIEWED_SEED_PATH}"
          ./Release/Core/validate_core_release_config.py --production
          COMPATIBILITY_REPORT="$(/usr/bin/python3 -c 'import json; print(json.load(open("Release/Core/config/core-release.json", encoding="utf-8"))["core"]["compatibilityReport"])')"
          DEDICATED_EVIDENCE="$(/usr/bin/python3 -c 'import json; print(json.load(open("Release/Core/config/core-release.json", encoding="utf-8"))["core"]["dedicatedHostEvidence"])')"
          PERFORMANCE_REVIEW="$(/usr/bin/python3 -c 'import json; print(json.load(open("Release/Core/config/core-release.json", encoding="utf-8"))["core"]["performanceReview"])')"
          ./Release/Core/CompatibilityLab/validate_compatibility_report.py \
            "${COMPATIBILITY_REPORT}" --core-id v1.19.28-r1 --production \
            --dedicated-host-evidence "${DEDICATED_EVIDENCE}" \
            --performance-review "${PERFORMANCE_REVIEW}"

      - name: Acquire immutable prior Core Catalog when required
        run: |
          VELA_CORE_RELEASE_EXECUTE=YES ./Release/Core/acquire_prior_core_catalog.sh --execute \
            --output "${VELA_CORE_PRIOR_CATALOG}"

      - name: Create ephemeral Core release credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          CORE_CATALOG_ED25519_PRIVATE_KEY: ${{ secrets.CORE_CATALOG_ED25519_PRIVATE_KEY }}
          CORE_CATALOG_ROTATION_ED25519_PRIVATE_KEY: ${{ secrets.CORE_CATALOG_ROTATION_ED25519_PRIVATE_KEY }}
        run: |
          umask 077
          test -n "${DEVELOPER_ID_P12_BASE64}"
          test -n "${DEVELOPER_ID_P12_PASSWORD}"
          test -n "${DEVELOPER_IDENTITY}"
          test -n "${NOTARY_API_KEY_P8_BASE64}"
          test -n "${NOTARY_KEY_ID}"
          test -n "${NOTARY_ISSUER_ID}"
          test -n "${CORE_CATALOG_ED25519_PRIVATE_KEY}"
          case "${VELA_CORE_CREDENTIAL_ROOT}" in
            "${RUNNER_TEMP}"/vela-core-credentials-*) ;;
            *) echo "unsafe Core credential root" >&2; exit 1 ;;
          esac
          test ! -e "${VELA_CORE_CREDENTIAL_ROOT}"
          /bin/mkdir -m 0700 "${VELA_CORE_CREDENTIAL_ROOT}"
          CORE_RELEASE_KEYCHAIN="${VELA_CORE_CREDENTIAL_ROOT}/core-release.keychain-db"
          P12_FILE="${VELA_CORE_CREDENTIAL_ROOT}/developer-id.p12"
          NOTARY_KEY_FILE="${VELA_CORE_CREDENTIAL_ROOT}/AuthKey.p8"
          CORE_CATALOG_KEY_FILE="${VELA_CORE_CREDENTIAL_ROOT}/core-catalog-ed25519.key"
          CORE_CATALOG_ROTATION_KEY_FILE="${VELA_CORE_CREDENTIAL_ROOT}/core-catalog-rotation-ed25519.key"
          ROTATION_KEY_ID="$(/usr/bin/python3 -c 'import json; value=json.load(open("Release/Core/config/core-release.json", encoding="utf-8"))["catalog"]["rotationKeyID"]; print("" if value is None else value)')"
          /usr/bin/security list-keychains -d user >"${VELA_CORE_CREDENTIAL_ROOT}/original-keychains.txt"
          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | /usr/bin/base64 -D >"${P12_FILE}"
          printf '%s' "${NOTARY_API_KEY_P8_BASE64}" | /usr/bin/base64 -D >"${NOTARY_KEY_FILE}"
          printf '%s\n' "${CORE_CATALOG_ED25519_PRIVATE_KEY}" >"${CORE_CATALOG_KEY_FILE}"
          if test -n "${ROTATION_KEY_ID}"; then
            test -n "${CORE_CATALOG_ROTATION_ED25519_PRIVATE_KEY}"
            printf '%s\n' "${CORE_CATALOG_ROTATION_ED25519_PRIVATE_KEY}" >"${CORE_CATALOG_ROTATION_KEY_FILE}"
          else
            test -z "${CORE_CATALOG_ROTATION_ED25519_PRIVATE_KEY}"
          fi
          /bin/chmod 0600 "${P12_FILE}" "${NOTARY_KEY_FILE}" "${CORE_CATALOG_KEY_FILE}" "${VELA_CORE_CREDENTIAL_ROOT}/original-keychains.txt"
          if test -n "${ROTATION_KEY_ID}"; then
            /bin/chmod 0600 "${CORE_CATALOG_ROTATION_KEY_FILE}"
          fi
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 32)"
          /usr/bin/security create-keychain -p "${KEYCHAIN_PASSWORD}" "${CORE_RELEASE_KEYCHAIN}"
          /usr/bin/security set-keychain-settings -lut 7200 "${CORE_RELEASE_KEYCHAIN}"
          /usr/bin/security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${CORE_RELEASE_KEYCHAIN}"
          /usr/bin/security import "${P12_FILE}" -k "${CORE_RELEASE_KEYCHAIN}" -P "${DEVELOPER_ID_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${CORE_RELEASE_KEYCHAIN}" >/dev/null
          /bin/chmod 0600 "${CORE_RELEASE_KEYCHAIN}"
          /usr/bin/security list-keychains -d user -s "${CORE_RELEASE_KEYCHAIN}"
          /usr/bin/security find-identity -p codesigning -v "${CORE_RELEASE_KEYCHAIN}" | /usr/bin/grep -Fq "\"${DEVELOPER_IDENTITY}\""
          CORE_NOTARY_PROFILE_PREFIX="$(/usr/bin/python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["signing"]["notaryProfilePrefix"])' Release/Core/config/core-release.json)"
          CORE_NOTARY_PROFILE="${CORE_NOTARY_PROFILE_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/bin/xcrun notarytool store-credentials "${CORE_NOTARY_PROFILE}" \
            --key "${NOTARY_KEY_FILE}" --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}" \
            --keychain "${CORE_RELEASE_KEYCHAIN}" --validate
          /bin/rm -f "${P12_FILE}" "${NOTARY_KEY_FILE}"
          {
            printf 'VELA_CORE_RELEASE_KEYCHAIN=%s\n' "${CORE_RELEASE_KEYCHAIN}"
            printf 'VELA_CORE_CATALOG_KEY_FILE=%s\n' "${CORE_CATALOG_KEY_FILE}"
            printf 'VELA_CORE_NOTARY_PROFILE=%s\n' "${CORE_NOTARY_PROFILE}"
            if test -n "${ROTATION_KEY_ID}"; then
              printf 'VELA_CORE_CATALOG_ROTATION_KEY_FILE=%s\n' "${CORE_CATALOG_ROTATION_KEY_FILE}"
            fi
          } >>"${GITHUB_ENV}"

      - name: Build sign notarize and stage immutable Core release
        env:
          REVIEWED_SEED_PATH: ${{ inputs.seed_path }}
        run: |
          VELA_CORE_RELEASE_EXECUTE=YES ./Release/Core/prepare_core_release.sh --execute \
            --seed "${REVIEWED_SEED_PATH}" --output "${VELA_CORE_PREPARED}" --keychain "${VELA_CORE_RELEASE_KEYCHAIN}"
          PUBLISH_ARGS=(
            --staging
            --prepared "${VELA_CORE_PREPARED}"
            --output "${VELA_CORE_PUBLIC}"
            --private-key-file "${VELA_CORE_CATALOG_KEY_FILE}"
          )
          if test -n "${VELA_CORE_CATALOG_ROTATION_KEY_FILE:-}"; then
            PUBLISH_ARGS+=(--rotation-private-key-file "${VELA_CORE_CATALOG_ROTATION_KEY_FILE}")
          fi
          if test -f "${VELA_CORE_PRIOR_CATALOG}" && test ! -L "${VELA_CORE_PRIOR_CATALOG}"; then
            PUBLISH_ARGS+=(--prior-catalog "${VELA_CORE_PRIOR_CATALOG}")
          fi
          VELA_CORE_RELEASE_EXECUTE=YES ./Release/Core/publish_core_release.sh "${PUBLISH_ARGS[@]}"

      - name: Scan staged public Core release
        run: ./Release/Core/scan_core_release.py "${VELA_CORE_PUBLIC}"

      - name: Create and verify complete private Core release evidence
        run: |
          EVIDENCE_ARGS=(
            --repository-root "${GITHUB_WORKSPACE}"
            --config Release/Core/config/core-release.json
            --prepared-directory "${VELA_CORE_PREPARED}"
            --public-directory "${VELA_CORE_PUBLIC}"
            --archive-output "${VELA_CORE_EVIDENCE_ROOT}/vela-core-private-evidence.zip"
            --manifest-output "${VELA_CORE_EVIDENCE_ROOT}/private-release-manifest.json"
          )
          if test -f "${VELA_CORE_PRIOR_CATALOG}" && test ! -L "${VELA_CORE_PRIOR_CATALOG}"; then
            EVIDENCE_ARGS+=(--prior-catalog "${VELA_CORE_PRIOR_CATALOG}")
          fi
          ./Release/Core/create_core_release_evidence.py "${EVIDENCE_ARGS[@]}"
          ./Release/Core/validate_core_release_evidence.py \
            "${VELA_CORE_EVIDENCE_ROOT}/vela-core-private-evidence.zip" \
            --manifest "${VELA_CORE_EVIDENCE_ROOT}/private-release-manifest.json"

      # actions/upload-artifact v4.6.2, pinned to the complete commit SHA.
      - name: Upload immutable public Core staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vela-signed-core-staging
          path: ${{ runner.temp }}/vela-core-public-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      # This is an operational recovery copy, not the required durable private
      # retention destination. Provider-specific durable retention is STOP-SHIP.
      - name: Upload short-lived private Core release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vela-core-private-evidence
          path: ${{ runner.temp }}/vela-core-private-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      - name: Destroy ephemeral Core release credentials and private staging
        if: always()
        run: |
          umask 077
          case "${VELA_CORE_CREDENTIAL_ROOT}" in
            "${RUNNER_TEMP}"/vela-core-credentials-*) ;;
            *) echo "refusing unsafe Core credential cleanup" >&2; exit 1 ;;
          esac
          if test -d "${VELA_CORE_CREDENTIAL_ROOT}" && test ! -L "${VELA_CORE_CREDENTIAL_ROOT}"; then
            ORIGINAL_KEYCHAINS="${VELA_CORE_CREDENTIAL_ROOT}/original-keychains.txt"
            if test -f "${ORIGINAL_KEYCHAINS}" && test ! -L "${ORIGINAL_KEYCHAINS}"; then
              ORIGINAL=()
              while IFS= read -r line; do
                line="$(printf '%s\n' "${line}" | /usr/bin/sed 's/^[[:space:]]*"//;s/"[[:space:]]*$//')"
                if test -n "${line}"; then ORIGINAL+=("${line}"); fi
              done <"${ORIGINAL_KEYCHAINS}"
              /usr/bin/security list-keychains -d user -s "${ORIGINAL[@]}" || true
            fi
            CORE_RELEASE_KEYCHAIN="${VELA_CORE_CREDENTIAL_ROOT}/core-release.keychain-db"
            if test -f "${CORE_RELEASE_KEYCHAIN}" && test ! -L "${CORE_RELEASE_KEYCHAIN}"; then
              /usr/bin/security lock-keychain "${CORE_RELEASE_KEYCHAIN}" || true
              /usr/bin/security delete-keychain "${CORE_RELEASE_KEYCHAIN}" || true
            fi
            /bin/rm -rf "${VELA_CORE_CREDENTIAL_ROOT}"
          fi
          case "${VELA_CORE_PREPARED}" in
            "${RUNNER_TEMP}"/vela-core-prepared-*) /bin/rm -rf "${VELA_CORE_PREPARED}" ;;
            *) echo "refusing unsafe private staging cleanup" >&2; exit 1 ;;
          esac
          case "${VELA_CORE_PRIOR_CATALOG}" in
            "${RUNNER_TEMP}"/vela-core-prior-catalog-*.json) /bin/rm -f "${VELA_CORE_PRIOR_CATALOG}" ;;
            *) echo "refusing unsafe prior Catalog cleanup" >&2; exit 1 ;;
          esac
          case "${VELA_CORE_EVIDENCE_ROOT}" in
            "${RUNNER_TEMP}"/vela-core-private-evidence-*) /bin/rm -rf "${VELA_CORE_EVIDENCE_ROOT}" ;;
            *) echo "refusing unsafe private evidence cleanup" >&2; exit 1 ;;
          esac
