name: Vela Beta bug
description: Report a reproducible Beta issue without credentials or private network data.
title: "[Beta] "
labels: ["beta", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Never post subscription URLs, credentials, controller secrets, private domains/IPs,
        SSIDs, node/profile names, raw configurations, unreviewed logs, or private keys.
        Security vulnerabilities belong in the private Security contact link, not this form.
  - type: input
    id: version
    attributes:
      label: Vela version, build, and channel
      placeholder: "1.0.0 (2026071403), RC 1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version/build and Apple Silicon category
      description: Do not include a serial number or account name.
    validations:
      required: true
  - type: dropdown
    id: app_location
    attributes:
      label: App location
      options: ["/Applications", "Downloads or translocated", "Read-only DMG", "Other (describe without username)"]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Network mode
      options: ["Off", "Engine Only", "System Proxy", "TUN mixed", "TUN system", "TUN gVisor"]
    validations:
      required: true
  - type: input
    id: components
    attributes:
      label: Core ID/version and Helper protocol/version
      description: Use the non-sensitive values shown by About or Diagnostics.
    validations:
      required: true
  - type: dropdown
    id: configuration_kind
    attributes:
      label: Configuration source kind
      options: ["Local synthetic/minimal", "Local profile", "Remote subscription", "Configuration Workbench", "Unknown"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and observed result
      description: Replace private values with category labels before submitting.
    validations:
      required: true
  - type: input
    id: reproducibility
    attributes:
      label: Reproducibility
      placeholder: "3/3 after relaunch; first seen in build …"
    validations:
      required: true
  - type: input
    id: regression
    attributes:
      label: Known-good and first-bad builds, if known
  - type: textarea
    id: recovery
    attributes:
      label: Safe recovery and cleanup result
      description: State whether networking, System Proxy, TUN, and the previous configuration were restored.
    validations:
      required: true
  - type: input
    id: signature
    attributes:
      label: Crash signature or stable result code
      description: Do not paste a raw crash log here.
  - type: input
    id: support_bundle
    attributes:
      label: Redacted Support Bundle ID, if available
      description: Give the ID only; attach a reviewed bundle manually only when requested.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, URLs, private host/IP/SSID/node/profile data, raw configuration, and unreviewed logs.
          required: true
