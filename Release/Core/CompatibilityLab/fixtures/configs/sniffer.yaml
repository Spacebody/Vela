mode: rule
log-level: warning
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  force-domain: ['+.fixture.example']
  skip-domain: ['+.skip.example']
  skip-src-address: [192.0.2.0/24]
  skip-dst-address: [2001:db8::/32]
proxies: []
proxy-groups:
  - {name: VELA-COMPAT, type: select, proxies: [DIRECT]}
rules:
  - MATCH,VELA-COMPAT
